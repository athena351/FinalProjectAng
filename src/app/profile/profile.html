<div class="profile">
    <div class="left">
        <div class="up">
            <div class="userPic"></div>
            <h2></h2>
            <p></p>
        </div>

        <div class="down">
            <div class="about active">
                <p><i class="fa-regular fa-user"></i></p>
                <p>My Profile</p>
            </div>

            <div class="about">
                <p><i class="fa-solid fa-cart-flatbed"></i></p>
                <p>Cart</p>
            </div>

            <div class="about">
                <p><i class="fa-regular fa-heart"></i></p>
                <p>Favorites</p>
            </div>

            <div class="about">
                <p><i class="fa-solid fa-gear"></i></p>
                <p>Settings</p>
            </div>

            <div class="line"></div>

            <div class="logout">
                <p><i class="fa-solid fa-arrow-right-from-bracket"></i></p>
                <p>Logout</p>
            </div>
        </div>
    </div>

    <div class="right">
        <div class="title">
            <h2>My Profile</h2>
            <p>Manage your personal information and preferences</p>
        </div>

        <div class="profilePicture">
            <div class="first">
                <p><i class="fa-solid fa-image"></i> Profile Picture</p>
            </div>

            <div class="second">
                <div class="left"></div>
                <div class="right">
                    <h3>Upload your photo</h3>
                    <p>Enter a URL to your profile picture</p>
                    <input type="text" placeholder="https://example.com/avatar.jpg">
                </div>
            </div>
        </div>

        <div class="personalInfo">
            <div class="first">
                <p><i class="fa-regular fa-user"></i> Personal information</p>
            </div>

            <div class="second">
                <div class="nameInputs">
                    <div class="firstName">
                        <p>*First Name</p>
                        <input type="text">
                    </div>

                    <div class="lastName">
                        <p>*Last Name</p>
                        <input type="text">
                    </div>
                </div>

                <div class="email">
                    <p>Email Address</p>
                    <input type="email">
                </div>

                <div class="dobAndPhone">
                    <div class="dob">
                        <p>Date of Birth</p>
                        <input type="date">
                    </div>

                    <div class="phone">
                        <p>Phone Number</p>
                        <input type="text" placeholder="+995 555 123 456">
                    </div>
                </div>
            </div>
        </div>

        <div class="address">
            <div class="first">
                <p><i class="fa-solid fa-location-dot"></i> Address</p>
            </div>

            <div class="second">
                <div class="streetAddress">
                    <p>Street Address</p>
                    <input type="text" placeholder="Enter your street address">
                </div>
            </div>
        </div>

        <div class="btns">
            <button class="discard"><i class="fa-solid fa-x"></i> Discard</button>
            <button class="save"><i class="fa-solid fa-check"></i> Save Changes</button>
        </div>
    </div>
</div>
