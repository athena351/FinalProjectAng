<div class="header">
  <div class="logoDiv">
    <div class="logo"></div>
    <h2>STEP TECH</h2>
  </div>

  <nav>
    <ul>
      <li routerLink="/home" routerLinkActive="active"><a>Home</a></li>
      <li routerLink="/shop" routerLinkActive="active"><a>Shop</a></li>
      <li class="categories">
        
          <a>Categories <i class="fa-solid fa-chevron-down"></i></a>
        
        <div class="dropDown">
          @for (item of categories; track $index) {
            <div class="name">
                <span>{{ item.name }}</span>
                <p>{{ item.productCount }}</p>
            </div>
          }
        </div>
      </li>
    </ul>
  </nav>

  <div class="search">
    <input type="text" placeholder="Search products..." />
  </div>

  <div class="signIn">
    <button routerLink="/auth">Sign In</button>
  </div>
</div>
